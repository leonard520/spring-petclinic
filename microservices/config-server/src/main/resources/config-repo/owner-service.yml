server:
  port: 8081

spring:
  application:
    name: owner-service
  datasource:
    url: jdbc:h2:mem:ownerdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
