version: '3.8'

services:
  # Infrastructure Services
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - petclinic-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - petclinic-network
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - petclinic-network
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/

  # Domain Services
  vet-service:
    build: ./vet-service
    container_name: vet-service
    ports:
      - "8084:8084"
    networks:
      - petclinic-network
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/

  owner-service:
    build: ./owner-service
    container_name: owner-service
    ports:
      - "8081:8081"
    networks:
      - petclinic-network
    depends_on:
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/

  pet-service:
    build: ./pet-service
    container_name: pet-service
    ports:
      - "8082:8082"
    networks:
      - petclinic-network
    depends_on:
      discovery-server:
        condition: service_healthy
      owner-service:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/

  visit-service:
    build: ./visit-service
    container_name: visit-service
    ports:
      - "8083:8083"
    networks:
      - petclinic-network
    depends_on:
      discovery-server:
        condition: service_healthy
      pet-service:
        condition: service_started
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/

networks:
  petclinic-network:
    driver: bridge
